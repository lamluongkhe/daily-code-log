{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.kafka.broker.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.kafka.broker.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.kafka.broker.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.kafka.broker.name }}
    spec:
      hostname: {{ .Values.kafka.broker.name }}
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        ports:
        - containerPort: {{ .Values.kafka.ports.external }}
        - containerPort: {{ .Values.kafka.ports.internal }}
        env:
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "{{ .Values.zookeeper.name }}:2181"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://{{ .Values.kafka.broker.name }}:{{ .Values.kafka.ports.internal }},PLAINTEXT_HOST://{{ .Values.kafka.broker.name }}:{{ .Values.kafka.ports.external }}"
        - name: KAFKA_BROKER_ID
          value: {{ .Values.kafka.broker.id | quote }}
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        
        startupProbe:
          tcpSocket:
            port: {{ .Values.kafka.ports.internal }}
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30

        readinessProbe:
          tcpSocket:
            port: {{ .Values.kafka.ports.internal }}
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          exec:
            command:
              - /bin/bash
              - -c
              - "kafka-topics --bootstrap-server localhost:{{ .Values.kafka.ports.external }} --list"
          initialDelaySeconds: 30
          periodSeconds: 60
{{- end }}

